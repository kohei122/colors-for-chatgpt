<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colors for ChatGPT (by marusin)</title><link rel="stylesheet" href="popup.css"></head>
<body><h1 aria-label="Colors for ChatGPT"><span aria-hidden="true"><span class="brand-colors"><span>C</span><span>o</span><span>l</span><span>o</span><span>r</span><span>s</span></span> <span class="brand-suffix">for ChatGPT</span></span></h1>
<div class="setting-row"><span id="enabled-label">拡張機能を有効にする</span><button id="enabled" type="button" role="switch" aria-checked="false" aria-labelledby="enabled-label" disabled>OFF</button></div>
<div class="setting-row"><span id="individual-label">このチャットで帯を表示</span><button id="individual" type="button" role="switch" aria-checked="false" aria-labelledby="individual-label" aria-describedby="chat-status" disabled>OFF</button></div>
<p id="chat-status" role="status">現在のチャットを確認中…</p><p id="status" role="status"></p>
<label class="language-row"><span>言語</span><select id="language" aria-label="言語"><option value="auto">自動</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="zh_CN">简体中文</option><option value="zh_TW">繁體中文</option><option value="es">Español</option><option value="pt_BR">Português (Brasil)</option></select></label><footer><a href="https://chromewebstore.google.com/search/(by%20marusin)?hl=ja&amp;authuser=0" target="_blank" rel="noopener noreferrer">marusin tools</a><small id="app-version"></small></footer>
<script src="i18n-data.js"></script><script src="i18n.js"></script><script src="popup.js"></script></body></html>
